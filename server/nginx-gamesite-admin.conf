# /etc/nginx/sites-available/gamesite-admin
#
# Админка Django на отдельном поддомене.
# Заменить admin.gamesite.duckdns.org на свой хост.
#
# Зачем отдельный домен:
#   1. На публичном сайте /admin/ отдаёт 404 — боты, которые весь день
#      перебирают /admin/, /wp-admin/ и прочее, не находят ничего.
#   2. Поддомен закрыт HTTP Basic Auth — до формы входа Django запрос
#      вообще не доходит, если не знаешь пары логин/пароль от nginx.
#   3. Логи админки отдельно от логов сайта — видно, кто туда стучится.
#
# upstream gamesite_app объявлен в nginx-gamesite.conf. Здесь его повторять
# НЕЛЬЗЯ: два одинаковых upstream в одном http-контексте — ошибка конфига.
#
# Порядок установки описан в server/ADMIN-SUBDOMAIN.md.

# Не больше 5 попыток входа в минуту с одного IP.
# Зона общая на весь nginx, поэтому объявлена вне server-блока.
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name admin.gamesite.duckdns.org;

    client_max_body_size 20M;

    access_log /var/log/nginx/gamesite-admin.access.log;
    error_log  /var/log/nginx/gamesite-admin.error.log;

    # Поддомен не должен попадать в поисковую выдачу
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    # same-origin, а не no-referrer.
    # По спецификации Fetch при referrer policy = no-referrer браузер шлёт
    # Origin: null даже на свой же домен. Django сравнивает null со списком
    # доверенных и отклоняет вход: "Origin checking failed - null".
    # same-origin шлёт настоящий Origin внутри домена и ничего наружу.
    add_header Referrer-Policy "same-origin" always;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # --- Форма входа: отдельно, чтобы навесить лимит попыток ---
    # Точное совпадение приоритетнее префикса /admin/, поэтому настройки
    # прокси приходится продублировать — nginx не наследует их из соседнего
    # location.
    location = /admin/login/ {
        limit_req zone=admin_login burst=5 nodelay;

        auth_basic "GameSite admin";
        auth_basic_user_file /etc/nginx/.htpasswd-admin;

        proxy_pass http://gamesite_app;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # --- Админка ---
    location /admin/ {
        auth_basic "GameSite admin";
        auth_basic_user_file /etc/nginx/.htpasswd-admin;

        # Пускать только со своего интернета — раскомментировать и подставить
        # свой IP. Имеет смысл, только если адрес статический, иначе
        # заблокируешь сам себя при смене IP у провайдера.
        # allow 203.0.113.0/24;
        # deny all;

        proxy_pass http://gamesite_app;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }

    # --- Статика Django ---
    # Без неё админка открывается голым HTML без стилей.
    # Basic Auth здесь не нужен: это те же файлы, что и на основном домене.
    location /static/ {
        alias /srv/gamesite/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Картинки в формах админки (превью загруженных обложек)
    location /media/ {
        alias /srv/gamesite/media/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Всего остального на этом поддомене не существует.
    # Ни сайта, ни API — только админка.
    location / {
        return 404;
    }
}
