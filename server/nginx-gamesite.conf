# /etc/nginx/sites-available/gamesite
#
# Один домен на весь проект: nginx отдаёт собранный React и проксирует /api/
# в Django. При такой схеме CORS не нужен вообще — фронт и бэк на одном origin.
#
# Заменить gamesite.duckdns.org на свой домен.
# После certbot он сам допишет 443-й блок и редирект с 80.

upstream gamesite_app {
    server unix:/run/gamesite/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name gamesite.duckdns.org;

    # Размер загружаемых картинок игр
    client_max_body_size 20M;

    access_log /var/log/nginx/gamesite.access.log;
    error_log  /var/log/nginx/gamesite.error.log;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    # --- Django API ---
    location /api/ {
        proxy_pass http://gamesite_app;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }

    # --- Админка Django ---
    location /admin/ {
        proxy_pass http://gamesite_app;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # --- Загруженные картинки игр ---
    location /media/ {
        alias /srv/gamesite/media/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # --- Статика Django (админка, DRF) ---
    location /static/ {
        alias /srv/gamesite/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # --- Собранный React ---
    root /srv/gamesite-front;
    index index.html;

    # Хэшированные ассеты Vite можно кэшировать навсегда
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA-роутинг: любой неизвестный путь отдаём index.html,
    # иначе прямой заход на /games или F5 даёт 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
